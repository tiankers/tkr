[[mods]]
modId="tkr"
version="${version}"
displayName="TKR Lib"
authors="tiankers"
description='''
TKR Lib adds a Strength attribute to every living entity and two item components that let weapons scale their damage with Strength along a smooth, capped curve.

* tkr:strength - an attribute available to all living entities, usable by any mod or datapack.
* tkr:strength_damage - per-weapon damage coefficient and threshold, for melee and ranged weapons; bonus damage grows linearly, then bends toward a hard cap of twice the threshold.
* tkr:min_strength - a Strength requirement that cancels attacks when unmet.
* Raises attribute caps so large values are not silently clamped.
* Commands: /tkr, /tkrattribute, /tkrlist

Requires no other mods. Built for Minecraft 1.21.1 / NeoForge.
'''

[[dependencies.tkr]]
modId="neoforge"
type="required"
versionRange="[21.1.232,)"
ordering="NONE"
side="BOTH"

[[dependencies.tkr]]
modId="minecraft"
